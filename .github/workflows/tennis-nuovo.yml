name: Tennis Live Alert
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/tennis-nuovo.yml'
  schedule:
    - cron: '4,19,34,49 * * * *'
permissions:
  contents: read
concurrency:
  group: tennis-live-alert
  cancel-in-progress: false
jobs:
  tennis-alert:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python -m unittest discover -v
      - name: Orario italiano
        id: orario
        run: |
          ORA=$(TZ=Europe/Rome date +%H%M)
          if [[ "$ORA" > "0759" && "$ORA" < "2300" ]]; then
            echo "attivo=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.orario.outputs.attivo == 'true'
      - uses: actions/setup-python@v5
        if: steps.orario.outputs.attivo == 'true'
        with:
          python-version: '3.11'
      - run: pip install requests
        if: steps.orario.outputs.attivo == 'true'
      - uses: actions/cache/restore@v4
        if: steps.orario.outputs.attivo == 'true'
        with:
          path: tennis-state.enc
          key: tennis-encrypted-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: tennis-encrypted-v1-
      - name: Ripristina stato protetto
        if: steps.orario.outputs.attivo == 'true'
        env:
          STATE_PASSWORD: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          test -n "$STATE_PASSWORD"
          if [ -f tennis-state.enc ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in tennis-state.enc -out tennis_stato_nuovo.json -pass env:STATE_PASSWORD
            python -m json.tool tennis_stato_nuovo.json >/dev/null
          fi
      - name: Controlla partite
        if: steps.orario.outputs.attivo == 'true'
        env:
          TENNIS_API_KEY: ${{ secrets.TENNIS_API_KEY }}
          MOVIODDS_API_KEY: ${{ secrets.MOVIODDS_API_KEY }}
          TENNIS_DRY_RUN: '0'
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          for name in TENNIS_API_KEY MOVIODDS_API_KEY TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID; do
            if [ -z "${!name}" ]; then echo "::error::Secret mancante: $name"; exit 1; fi
          done
          # Refresh limited tennis market feed
          rc=0
          python tennis_bot_nuovo.py > /tmp/tennis-run.log 2>&1 || rc=$?
          grep -E '^Diagnostica MoviOdds: (HTTP [0-9]{3}( (JSON|HTML|altro))?|redirect non seguito|[A-Za-z]+Error|[A-Za-z]*Timeout|formato inatteso|JSON non valido|autenticazione e risposta OK|quote in cache soltanto)$' /tmp/tennis-run.log || true
          if [ "$rc" -eq 0 ]; then
            echo "Controllo completato."
            grep -E '^(Alert rilevati|Partite live valide|Partite MoviOdds): [0-9]+$' /tmp/tennis-run.log || true
          else
            python - <<'PY'
          import json
          from pathlib import Path
          for line in Path("/tmp/tennis-run.log").read_text(errors="replace").splitlines():
              if line.startswith("API_MONITOR: "):
                  try:
                      e = json.loads(line[len("API_MONITOR: "):])
                      if e.get("service") in {"api.livetennisapi.com", "moviodds.com", "telegram"}:
                          status = e.get("status")
                          print("Diagnostica:", e["service"], "HTTP", status if isinstance(status, int) else "nessuna risposta")
                  except (ValueError, TypeError):
                      pass
              elif line.startswith("ERRORE: Risposta LiveTennisAPI senza elenco data"):
                  print("Diagnostica: formato LiveTennisAPI inatteso")
              elif line.startswith("ERRORE: Risposta MoviOdds senza matches"):
                  print("Diagnostica: formato MoviOdds inatteso")
          PY
            echo "::error::Controllo fallito; dettagli riservati non pubblicati."
            exit 1
          fi
      - name: Cifra stato
        id: encrypt
        if: always() && steps.orario.outputs.attivo == 'true'
        env:
          STATE_PASSWORD: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          if [ -s tennis_stato_nuovo.json ] && [ -n "$STATE_PASSWORD" ]; then
            python -m json.tool tennis_stato_nuovo.json >/dev/null
            openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 -in tennis_stato_nuovo.json -out tennis-state.enc -pass env:STATE_PASSWORD
            echo "saved=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/cache/save@v4
        if: always() && steps.encrypt.outputs.saved == 'true'
        with:
          path: tennis-state.enc
          key: tennis-encrypted-v1-${{ github.run_id }}-${{ github.run_attempt }}
